<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="Kids Read For Fun is a book review blog featuring books for young readers."
    />

    <meta name="author" content="Ekpenyong Etim" />

    <title>Kids Read For Fun</title>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="blog.css" />
  </head>

  <body>
    <div class="page">
      <header class="site-header">
        <h1>Kids Read For Fun</h1>

        <nav aria-label="Main navigation">
          <a href="about">About</a>
          <a href="archive">Archive</a>
          <a href="search">Search</a>
        </nav>
      </header>

      <main>
        <article class="book-review">
          <aside class="book-details" aria-label="Book details">
            <p class="date">
              <time datetime="2022-07-05">July 5, 2022</time>
            </p>

            <p>10-14</p>

            <p>Fantasy</p>

            <p class="rating" aria-label="4 out of 5 stars">
              <span aria-label="5 out of 5 stars" role="img">⭐⭐⭐⭐⭐</span>
            </p>
          </aside>

          <div class="book-content">
            <h2>Septimus Heap Book One: Magyk</h2>

            <img
              src="https://upload.wikimedia.org/wikipedia/en/5/5f/Magkycover2.jpg"
              alt="Book cover of Magyk by Angie Sage"
              width="150"
              height="225"
            />

            <p>
              If you enjoy stories about seventh sons of seventh sons and magyk
              this is the book for you.
            </p>
          </div>
        </article>
      </main>

      <footer id="about">
        <p>Ekpenyong Etim</p>
      </footer>
    </div>
  </body>
</html>
