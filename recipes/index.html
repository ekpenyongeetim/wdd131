<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="Discover delicious recipes, including our homemade apple crisp dessert."
    />

    <meta name="author" content="Your Name" />

    <title>RecipeBook | Delicious Recipes</title>

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="RecipeBook | Delicious Recipes" />
    <meta
      property="og:description"
      content="Discover delicious recipes and enjoy cooking something special."
    />
    <meta
      property="og:url"
      content="https://ekpenyongeetim.github.io/wdd131/recipes/"
    />
    <meta
      property="og:image"
      content="https://ekpenyongeetim.github.io/wdd131/recipes/images/social-preview-image.png"
    />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="RecipeBook | Delicious Recipes" />
    <meta
      name="twitter:description"
      content="Discover delicious recipes and enjoy cooking something special."
    />
    <meta
      name="twitter:image"
      content="https://ekpenyongeetim.github.io/wdd131/recipes/images/social-preview-image.png"
    />

    <!-- Icons -->
    <link rel="icon" href="images/favicon.ico" />
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="recipes.css" />
  </head>

  <body>
    <header>
      <div class="logo">
        <img src="images/recipe-book.png" alt="RecipeBook logo" />
        <h1>RecipeBook</h1>
      </div>
    </header>

    <main>
      <!-- Search Section -->
      <section class="search">
        <form action="#" method="get" role="search">
          <label for="search-input" class="visually-hidden">
            Find a recipe
          </label>

          <input
            type="search"
            id="search-input"
            name="q"
            placeholder="Find a recipe"
          />

          <button type="submit" aria-label="Search recipes">
            <img src="images/search.svg" alt="" />
          </button>
        </form>
      </section>

      <!-- Recipe Section -->
      <section class="recipes" aria-label="Recipe collection">
        <article class="recipe-card">
          <img
            class="recipe-image"
            src="images/apple-crisp.jpg"
            alt="A serving of homemade apple crisp topped with vanilla ice cream"
          />

          <div class="recipe-content">
            <span class="category">dessert</span>

            <div class="recipe-details">
              <h2>Apple Crisp</h2>

              <!-- Accessible Rating -->
              <span
                class="rating"
                role="img"
                aria-label="Rating: 4 out of 5 stars"
              >
                <span aria-hidden="true" class="icon-star">⭐</span>
                <span aria-hidden="true" class="icon-star">⭐</span>
                <span aria-hidden="true" class="icon-star">⭐</span>
                <span aria-hidden="true" class="icon-star">⭐</span>
                <span aria-hidden="true" class="icon-star-empty">☆</span>
              </span>

              <p class="description">
                This apple crisp recipe is a simple yet delicious fall dessert
                that's great served warm with vanilla ice cream.
              </p>
            </div>
          </div>
        </article>
      </section>
    </main>

    <footer>
      <div class="attribution">
        <a
          href="https://www.flaticon.com/free-icons/recipe"
          title="recipe icons"
        >
          Recipe icons created by Freepik - Flaticon
        </a>
      </div>

      <div class="social">
        <!-- Social media icons provided under CC from
            https://www.iconfinder.com/AlfredoCreates -->

        <a href="#" aria-label="Instagram">
          <img src="images/instagram_icon.svg" alt="" />
        </a>

        <a href="#" aria-label="YouTube">
          <img src="images/youtube_icon.svg" alt="" />
        </a>

        <a href="#" aria-label="Pinterest">
          <img src="images/pinterest_icon.svg" alt="" />
        </a>
      </div>
    </footer>
  </body>
</html>
