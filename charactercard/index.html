<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="Meet Snortleblat, a swamp beast diplomat. View character statistics, attack, and level up."
    />

    <title>Character Card | Snortleblat</title>

    <!-- Open Graph (Facebook, LinkedIn, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Character Card - Snortleblat" />
    <meta
      property="og:description"
      content="Meet Snortleblat, a swamp beast diplomat."
    />
    <meta
      property="og:url"
      content="https://yourusername.github.io/wdd131/charactercard/"
    />
    <meta
      property="og:image"
      content="https://andejuli.github.io/wdd131/character_card/snortleblat.webp"
    />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Character Card - Snortleblat" />
    <meta
      name="twitter:description"
      content="Meet Snortleblat, a swamp beast diplomat."
    />
    <meta
      name="twitter:image"
      content="https://andejuli.github.io/wdd131/character_card/snortleblat.webp"
    />

    <!-- Favicon -->
    <link rel="icon" href="favicon.ico" />

    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png" />

    <!-- CSS -->
    <link rel="stylesheet" href="charactercard.css" />

    <!-- JavaScript -->
    <script src="charactercard.js" defer></script>
  </head>

  <body>
    <main>
      <h1>Character Card</h1>

      <section class="card">
        <img
          class="image"
          src="https://andejuli.github.io/wdd131/character_card/snortleblat.webp"
          alt="Snortleblat the Swamp Beast Diplomat"
        />

        <h2 class="name" id="character-name">Snortleblat</h2>

        <div class="stats">
          <p>Class: <span id="class">Diplomat</span></p>

          <p>Level: <span id="level">1</span></p>

          <p>Health: <span id="health">100</span></p>

          <p id="status">Ready for an adventure!</p>
        </div>

        <div class="buttons">
          <button id="attack-button" type="button">Attack</button>

          <button id="level-up-button" type="button">Level Up</button>
        </div>
      </section>
    </main>
  </body>
</html>
